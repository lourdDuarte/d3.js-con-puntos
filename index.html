<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Línea de tiempo</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app" class="app">

    <!-- ===================== TOP BAR ===================== -->
    <header class="topbar">
      <div class="topbar__title" id="app-title">Línea de tiempo</div>

      <div class="topbar__search">
        <svg class="topbar__search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
        </svg>
        <input type="text" id="search-input" class="topbar__search-input" placeholder="Buscar…" autocomplete="off">
        <button type="button" id="search-clear" class="topbar__search-clear" aria-label="Limpiar búsqueda" hidden>&times;</button>
      </div>

      <div class="topbar__meta">
        <span id="results-count">0 hitos</span>
      </div>

      <button type="button" id="filters-toggle" class="topbar__filters-toggle" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
        </svg>
        Filtros
      </button>
    </header>

    <!-- ===================== BODY ===================== -->
    <div class="body">

      <!-- ---------- SIDEBAR: FILTROS ---------- -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
          <h2>Filtros</h2>
          <button type="button" id="clear-filters" class="sidebar__clear">Limpiar filtros</button>
        </div>

        <div class="filter-group" data-filter="categoria">
          <button type="button" class="filter-group__header" aria-expanded="true">
            <span>Categoría</span>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <div class="filter-group__body" id="filter-categoria"></div>
        </div>

        <div class="filter-group" data-filter="subcategoria">
          <button type="button" class="filter-group__header" aria-expanded="false">
            <span>Subcategoría</span>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <div class="filter-group__body" id="filter-subcategoria"></div>
        </div>

        <div class="filter-group" data-filter="estado">
          <button type="button" class="filter-group__header" aria-expanded="true">
            <span>Estado</span>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <div class="filter-group__body" id="filter-estado"></div>
        </div>

        <div class="filter-group" data-filter="anio">
          <button type="button" class="filter-group__header" aria-expanded="true">
            <span>Año</span>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <div class="filter-group__body filter-group__body--range" id="filter-anio">
            <div class="range-values">
              <span id="anio-min-label"></span>
              <span id="anio-max-label"></span>
            </div>
            <div class="range-slider" id="anio-range-slider">
              <div class="range-slider__track"></div>
              <div class="range-slider__fill" id="anio-range-fill"></div>
              <input type="range" id="anio-min" class="range-slider__input">
              <input type="range" id="anio-max" class="range-slider__input">
            </div>
          </div>
        </div>

        <div class="filter-group" data-filter="fuente">
          <button type="button" class="filter-group__header" aria-expanded="false">
            <span>Fuente</span>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <div class="filter-group__body" id="filter-fuente"></div>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- ---------- MAIN: TIMELINE ---------- -->
      <main class="main">
        <div id="status-banner" class="status-banner" hidden></div>

        <div class="timeline-toolbar">
          <div class="timeline-toolbar__zoom">
            <button type="button" id="zoom-out" aria-label="Alejar">&minus;</button>
            <button type="button" id="zoom-reset" aria-label="Restablecer zoom">Restablecer</button>
            <button type="button" id="zoom-in" aria-label="Acercar">+</button>
          </div>
          <div class="timeline-toolbar__legend" id="estado-legend"></div>
        </div>

        <div class="timeline-wrapper" id="timeline-wrapper">
          <svg id="timeline-svg" class="timeline-svg"></svg>
        </div>
      </main>
    </div>
  </div>

  <!-- ===================== TOOLTIP ===================== -->
  <div id="tooltip" class="tooltip" hidden></div>

  <!-- ===================== DETAIL PANEL ===================== -->
  <div id="detail-backdrop" class="detail-backdrop" hidden></div>
  <aside id="detail-panel" class="detail-panel" hidden aria-hidden="true">
    <button type="button" id="detail-close" class="detail-panel__close" aria-label="Cerrar">&times;</button>
    <div id="detail-content" class="detail-panel__content"></div>
  </aside>

  <!-- ===================== LIBRERÍAS (CDN) ===================== -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>

  <!-- ===================== APP ===================== -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
